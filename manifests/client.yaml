---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immo-client
  labels:
    app: immo-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: immo-client
  template:
    metadata:
      labels:
        app: immo-client
    spec:
      containers:
        - name: nginx
          image: sorydiallo89/gitops-project:client-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: immo-client
spec:
  type: NodePort
  selector:
    app: immo-client
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
