---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immobilier-idf
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sory89/immobilier_idf_gitops.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: immobilier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
