---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immo-api
  labels:
    app: immo-api
spec:
  # Un seul replica : sur un cluster mononoeud, deux pods n'apportent aucune
  # disponibilite reelle et doublent la consommation memoire.
  replicas: 1
  selector:
    matchLabels:
      app: immo-api
  template:
    metadata:
      labels:
        app: immo-api
    spec:
      containers:
        - name: api
          image: sorydiallo89/gitops-project:api-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            # Limite relevee a 1,5 Gi : les pods etaient tues (exit code 137)
            # a 768 Mi, pandas et scipy consommant plus que prevu au chargement.
            limits:
              memory: "1536Mi"
              cpu: "500m"
          # Le modele est charge au demarrage (lifespan) : laisser le temps
          # a scikit-learn, pandas et scipy de s'importer avant de sonder.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          # runAsUser est obligatoire avec runAsNonRoot : sans UID explicite,
          # kubelet ne peut pas verifier que l'image ne tourne pas en root et
          # refuse de creer le conteneur (CreateContainerConfigError).
          # 10001 correspond au useradd -u 10001 appuser du Dockerfile.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: immo-api
  labels:
    app: immo-api
spec:
  type: ClusterIP
  selector:
    app: immo-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
