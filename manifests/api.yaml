---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immo-api
  labels:
    app: immo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: immo-api
  template:
    metadata:
      labels:
        app: immo-api
    spec:
      containers:
        - name: api
          image: sorydiallo89/gitops-project:api-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: immo-api
spec:
  type: ClusterIP
  selector:
    app: immo-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
