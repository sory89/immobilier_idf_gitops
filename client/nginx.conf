server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolveur DNS du cluster. Indispensable : sans variable dans proxy_pass,
    # nginx resout l'IP du service une seule fois au demarrage et la garde en
    # cache indefiniment. Apres recreation du service, l'IP change et toutes les
    # requetes remontent en 502 (connect() failed - Connection refused).
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    resolver_timeout 5s;

    set $api_upstream "immo-api.immobilier.svc.cluster.local:8000";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les appels du front sont relayes vers l'API : le navigateur ne voit qu'une
    # seule origine, il n'y a donc aucun CORS a gerer.
    location ~ ^/(predire|villes|quartiers|villes_quartiers|health|docs|openapi\.json) {
        proxy_pass http://$api_upstream;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
